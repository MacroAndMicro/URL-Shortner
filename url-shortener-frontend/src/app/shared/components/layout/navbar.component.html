<nav class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
  <div class="section flex h-16 items-center justify-between gap-4">
    <a routerLink="/" class="flex shrink-0 items-center gap-2.5" aria-label="ShortLink home">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-orange-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
      </span>
      <span class="text-lg font-bold tracking-tight text-navy-900 dark:text-white">ShortLink</span>
    </a>

    <!-- Desktop -->
    <div class="hidden items-center gap-1 md:flex">
      @if (auth.isAuthenticated()) {
        <a routerLink="/dashboard" routerLinkActive="!text-orange-600 dark:!text-orange-400" class="btn-ghost">Dashboard</a>
        <a routerLink="/urls/create" routerLinkActive="!text-orange-600 dark:!text-orange-400" class="btn-ghost">Create</a>
        <a routerLink="/urls" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="!text-orange-600 dark:!text-orange-400" class="btn-ghost">My URLs</a>
        <a routerLink="/plan" routerLinkActive="!text-orange-600 dark:!text-orange-400" class="btn-ghost">Plan</a>
        <span class="mx-2 h-5 w-px bg-slate-200 dark:bg-slate-700" aria-hidden="true"></span>
        <button type="button" (click)="auth.logout().subscribe()" class="btn-ghost">Log out</button>
      } @else {
        <a routerLink="/login" class="btn-ghost">Log in</a>
        <a routerLink="/register" class="btn-accent ml-1">Sign up free</a>
      }
      <app-theme-toggle />
    </div>

    <!-- Mobile -->
    <div class="flex items-center gap-1 md:hidden">
      <app-theme-toggle />
      <button type="button" (click)="mobileOpen.set(!mobileOpen())" class="btn-ghost !px-2"
              [attr.aria-expanded]="mobileOpen()" aria-controls="mobile-menu" aria-label="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          @if (mobileOpen()) {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          }
        </svg>
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <div id="mobile-menu" class="section space-y-1 border-t border-slate-200 py-3 md:hidden dark:border-slate-800">
      @if (auth.isAuthenticated()) {
        <a routerLink="/dashboard" class="btn-ghost w-full !justify-start" (click)="mobileOpen.set(false)">Dashboard</a>
        <a routerLink="/urls/create" class="btn-ghost w-full !justify-start" (click)="mobileOpen.set(false)">Create</a>
        <a routerLink="/urls" class="btn-ghost w-full !justify-start" (click)="mobileOpen.set(false)">My URLs</a>
        <a routerLink="/plan" class="btn-ghost w-full !justify-start" (click)="mobileOpen.set(false)">Plan</a>
        <button type="button" (click)="auth.logout().subscribe(); mobileOpen.set(false)" class="btn-ghost w-full !justify-start">Log out</button>
      } @else {
        <a routerLink="/login" class="btn-ghost w-full !justify-start" (click)="mobileOpen.set(false)">Log in</a>
        <a routerLink="/register" class="btn-accent w-full" (click)="mobileOpen.set(false)">Sign up free</a>
      }
    </div>
  }
</nav>
