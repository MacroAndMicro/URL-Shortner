<nav class="bg-navy-900 sticky top-0 z-50 shadow-nav border-b border-navy-500/20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      <a routerLink="/" class="flex items-center gap-2.5 shrink-0">
        <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
        </div>
        <span class="text-xl font-bold text-white tracking-tight">ShortLink</span>
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex md:items-center md:gap-1">
        @if (auth.isAuthenticated()) {
          <a routerLink="/dashboard" routerLinkActive="!text-white !bg-white/10" class="btn-ghost">Dashboard</a>
          <a routerLink="/urls/create" routerLinkActive="!text-white !bg-white/10" class="btn-ghost">Create</a>
          <a routerLink="/urls" routerLinkActive="!text-white !bg-white/10" class="btn-ghost">My URLs</a>
          <a routerLink="/plan" routerLinkActive="!text-white !bg-white/10" class="btn-ghost">Plan</a>
          <div class="w-px h-5 bg-white/20 mx-2"></div>
          <button (click)="auth.logout().subscribe()" class="btn-ghost text-white/50">Logout</button>
        } @else {
          <a routerLink="/login" class="btn-ghost">Login</a>
          <a routerLink="/register" class="ml-2 btn-accent text-sm">Sign Up Free</a>
        }
        <app-theme-toggle />
      </div>

      <!-- Mobile toggle -->
      <div class="flex items-center gap-2 md:hidden">
        <app-theme-toggle />
        <button (click)="mobileOpen.set(!mobileOpen())" class="p-2 text-white/70 hover:text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (mobileOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            }
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    @if (mobileOpen()) {
      <div class="md:hidden border-t border-white/10 py-3 space-y-1 animate-slide-in-right">
        @if (auth.isAuthenticated()) {
          <a routerLink="/dashboard" class="block btn-ghost w-full text-left" (click)="mobileOpen.set(false)">Dashboard</a>
          <a routerLink="/urls/create" class="block btn-ghost w-full text-left" (click)="mobileOpen.set(false)">Create</a>
          <a routerLink="/urls" class="block btn-ghost w-full text-left" (click)="mobileOpen.set(false)">My URLs</a>
          <a routerLink="/plan" class="block btn-ghost w-full text-left" (click)="mobileOpen.set(false)">Plan</a>
          <button (click)="auth.logout().subscribe(); mobileOpen.set(false)" class="block btn-ghost w-full text-left text-white/50">Logout</button>
        } @else {
          <a routerLink="/login" class="block btn-ghost w-full text-left" (click)="mobileOpen.set(false)">Login</a>
          <a routerLink="/register" class="block w-full mt-1 btn-accent text-center" (click)="mobileOpen.set(false)">Sign Up Free</a>
        }
      </div>
    }
  </div>
</nav>
