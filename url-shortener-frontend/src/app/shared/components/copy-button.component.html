<button
  type="button"
  (click)="copy()"
  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium
         bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white
         hover:bg-slate-200 dark:hover:bg-slate-700
         transition-all duration-200 active:scale-95">
  @if (copied()) {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
    <span class="text-green-600">Copied!</span>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
    <span>{{ label() }}</span>
  }
</button>
