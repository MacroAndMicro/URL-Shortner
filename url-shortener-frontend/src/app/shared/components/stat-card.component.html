<div class="card h-full">
  <p class="text-sm font-medium text-slate-500 dark:text-slate-400">{{ label() }}</p>
  <p class="mt-1 truncate text-3xl font-bold tracking-tight text-slate-900 dark:text-white" [title]="value()">{{ value() }}</p>
  @if (comparison()) {
    <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ comparison() }}</p>
  }
</div>
