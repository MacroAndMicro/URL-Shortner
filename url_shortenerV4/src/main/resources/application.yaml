spring:
  application:
    name: Url_Shortener

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/urlshortener}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
    # Fail within 3 s, not the default 30 s, when Postgres cannot hand out a connection.
    hikari:
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  # Existing databases were created by Hibernate, so they start at the V1 baseline.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  # ============================================================
  # POLYGLOT PERSISTENCE: Redis Cache
  # ============================================================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
    mongodb:
      auto-index-creation: true

  # ============================================================
  # POLYGLOT PERSISTENCE: MongoDB (Analytics)
  # ============================================================
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/urlshortener}
    database: urlshortener

  # ============================================================
  # POLYGLOT PERSISTENCE: Kafka (Analytics Event Streaming)
  # Producer, consumer and retry settings are in KafkaConfig.
  # ============================================================
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ============================================================
# Application Settings
# ============================================================
app:
  # Circuit breakers (see ResilienceConfig). Each watches its last window-size
  # calls; once minimum-calls were made, if failure-rate-percent of them failed
  # or were slower than the slow-call threshold, calls fail at once for
  # open-duration, then half-open-calls are let through as a trial.
  circuit-breaker:
    window-size: 20
    minimum-calls: 10
    failure-rate-percent: 50
    open-duration: 30s
    half-open-calls: 3
    slow-call: 2s
    redis-slow-call: 300ms
    kafka-slow-call: 500ms
  # Sign in with Google / GitHub. A provider is enabled only when both its id
  # and secret are set; see docs/oauth-setup.md for how to get them.
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  mongodb:
    server-selection-timeout: 2s
    connect-timeout: 2s
    read-timeout: 5s
  # Every running instance needs its own worker id (0-1023), or two instances
  # can hand out the same short code.
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:0}
  guest:
    # Guest links per IP address per day, on top of one active link per browser.
    ip-daily-limit: ${GUEST_IP_DAILY_LIMIT:10}
  dev:
    # Lets signed-in users change their own plan without paying, via
    # POST /api/v1/account/plan/dev. Never enable in production.
    plan-switch-enabled: ${DEV_PLAN_SWITCH_ENABLED:false}
  cache:
    redis:
      ttl-hours: ${REDIS_CACHE_TTL_HOURS:24}
  analytics:
    ip-salt: ${ANALYTICS_IP_SALT:}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    shorten-per-minute: ${RATE_LIMIT_SHORTEN_PER_MINUTE:60}
    redirect-per-minute: ${RATE_LIMIT_REDIRECT_PER_MINUTE:600}

# ============================================================
# OBSERVABILITY: Spring Boot Actuator & Prometheus
# Served on a separate port that is not published by Docker Compose.
# ============================================================
management:
  server:
    port: ${MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    tags:
      application: url-shortener

# ============================================================
# POLYGLOT PERSISTENCE: DynamoDB Configuration
# ============================================================
dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${AWS_REGION:us-east-1}
  table-name: ${DYNAMODB_TABLE_NAME:url_mappings}
