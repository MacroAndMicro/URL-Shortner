spring:
  application:
    name: Url_Shortener

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  # ============================================================
  # POLYGLOT PERSISTENCE: Redis Cache
  # ============================================================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
    # ============================================================
    # POLYGLOT PERSISTENCE: MongoDB (Analytics)
    # ============================================================
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/urlshortener}
      database: urlshortener

  # ============================================================
  # POLYGLOT PERSISTENCE: Kafka (Analytics Event Streaming)
  # ============================================================
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        batch.size: 16384
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: analytics-consumer
      properties:
        spring.json.trusted.packages: "com.Url_Shortener.event"
    listener:
      ack-mode: manual
    retry:
      topic:
        enabled: true
      attempts: 3
      backoff:
        initial-interval: 1000
        multiplier: 2.0
        max-interval: 10000

jwt:
  secret: ${JWT_SECRET:gcowAfycBs76wnCP7cvO6xe5Qtq2hZWd2k++abz5ub0=}
  expiration: 86400000
  refresh-expiration: 604800000

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ============================================================
# Application Cache Settings
# ============================================================
app:
  cache:
    redis:
      ttl-hours: ${REDIS_CACHE_TTL_HOURS:24}

# ============================================================
# POLYGLOT PERSISTENCE: DynamoDB Configuration
# ============================================================
dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${AWS_REGION:us-east-1}
  table-name: ${DYNAMODB_TABLE_NAME:url_mappings}
