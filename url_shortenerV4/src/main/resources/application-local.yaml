# ============================================================
# Local Development Profile
# Run with: --spring.profiles.active=local
# Or set in IDE: spring.profiles.active=local
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/urlshortener
    username: postgres
    password: postgres123

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ============================================================
# POLYGLOT PERSISTENCE: DynamoDB Local (local dev)
# ============================================================
dynamodb:
  enabled: false
  endpoint: http://localhost:8000
  region: us-east-1
  table-name: url_mappings

# Debug logging for local development
logging:
  level:
    com.Url_Shortener: DEBUG
    org.springframework.security: DEBUG
